name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract current version
        id: current
        run: |
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract previous version
        id: previous
        run: |
          PREV=$(git show HEAD~1:Cargo.toml 2>/dev/null | grep -oP '^version\s*=\s*"\K[^"]+' || echo "")
          echo "version=$PREV" >> "$GITHUB_OUTPUT"

      - name: Check version changed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" != "" ] && [ "${{ steps.current.outputs.version }}" != "${{ steps.previous.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag exists
        if: steps.check.outputs.changed == 'true'
        id: tag_check
        run: |
          TAG="v${{ steps.current.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        with:
          targets: >-
            x86_64-unknown-linux-musl,
            aarch64-unknown-linux-musl,
            x86_64-apple-darwin,
            aarch64-apple-darwin,
            x86_64-pc-windows-msvc,
            aarch64-pc-windows-msvc

      - name: Install cross
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binaries
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          mkdir -p dist

          declare -A TARGETS=(
            ["linux-x86_64"]="x86_64-unknown-linux-musl"
            ["linux-aarch64"]="aarch64-unknown-linux-musl"
            ["macos-x86_64"]="x86_64-apple-darwin"
            ["macos-aarch64"]="aarch64-apple-darwin"
            ["windows-x86_64"]="x86_64-pc-windows-msvc"
            ["windows-aarch64"]="aarch64-pc-windows-msvc"
          )

          for LABEL in "${!TARGETS[@]}"; do
            TARGET="${TARGETS[$LABEL]}"
            echo "Building for $LABEL ($TARGET)..."

            cross build --release --target "$TARGET"

            BIN="target/$TARGET/release/ezpm"
            if [[ "$LABEL" == windows-* ]]; then
              BIN="${BIN}.exe"
            fi

            ZIP_NAME="ezpm-${VERSION}-${LABEL}.zip"
            zip -j "dist/$ZIP_NAME" "$BIN"
          done

      - name: Create release
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.current.outputs.version }}"
          gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --target main
