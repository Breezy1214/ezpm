name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "EZPM_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Validate tag matches Cargo.toml version
        shell: bash
        run: |
          TOML_VERSION="$(grep -m1 '^version\s*=\s*"' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "$TOML_VERSION" ]]; then
            echo "Could not resolve package version from Cargo.toml"
            exit 1
          fi
          if [[ "$TOML_VERSION" != "$EZPM_VERSION" ]]; then
            echo "Tag version (${EZPM_VERSION}) does not match Cargo.toml version (${TOML_VERSION})."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Unix)
        if: matrix.os != 'windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows x86_64)
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Build (Windows aarch64)
        if: matrix.os == 'windows' && matrix.arch == 'aarch64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows'
        run: |
          ZIP_NAME="ezpm-${EZPM_VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          cp target/${{ matrix.target }}/release/ezpm ./ezpm
          zip "${ZIP_NAME}" ezpm
          rm ezpm

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ZIP_NAME = "ezpm-$env:EZPM_VERSION-${{ matrix.os }}-${{ matrix.arch }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/ezpm.exe" -Destination "ezpm.exe"
          Compress-Archive -Path "ezpm.exe" -DestinationPath $ZIP_NAME
          Remove-Item "ezpm.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezpm-${{ matrix.os }}-${{ matrix.arch }}
          path: "*.zip"

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
