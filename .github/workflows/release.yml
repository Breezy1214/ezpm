name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/version.luau'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract current version
        id: current
        run: |
          VERSION=$(grep -oP 'EZPM_VERSION\s*=\s*"\K[^"]+' src/version.luau)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract previous version
        id: previous
        run: |
          PREV=$(git show HEAD~1:src/version.luau 2>/dev/null | grep -oP 'EZPM_VERSION\s*=\s*"\K[^"]+' || echo "")
          echo "version=$PREV" >> "$GITHUB_OUTPUT"

      - name: Check version changed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" != "" ] && [ "${{ steps.current.outputs.version }}" != "${{ steps.previous.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag exists
        if: steps.check.outputs.changed == 'true'
        id: tag_check
        run: |
          TAG="v${{ steps.current.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rokit toolchain
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Bundle with DarkLua
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p build dist
          darklua process src/init.luau build/bundled.luau --config .darklua-build.json

      - name: Build binaries
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          TARGETS=(
            "linux-x86_64"
            "linux-aarch64"
            "macos-x86_64"
            "macos-aarch64"
            "windows-x86_64"
            "windows-aarch64"
          )

          for TARGET in "${TARGETS[@]}"; do
            echo "Building for $TARGET..."
            OUTPUT_NAME="ezpm"
            if [[ "$TARGET" == windows-* ]]; then
              OUTPUT_NAME="ezpm.exe"
            fi

            lune build build/bundled.luau --output "build/$OUTPUT_NAME" --target "$TARGET"

            ZIP_NAME="ezpm-${VERSION}-${TARGET}.zip"
            (cd build && zip "../dist/$ZIP_NAME" "$OUTPUT_NAME")
            rm "build/$OUTPUT_NAME"
          done

      - name: Create release
        if: steps.check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.current.outputs.version }}"
          gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --target main
