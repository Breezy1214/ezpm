name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  check:
    name: Check version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.current.outputs.version }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract current version
        id: current
        run: |
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract previous version
        id: previous
        run: |
          PREV=$(git show HEAD~1:Cargo.toml 2>/dev/null | grep -oP '^version\s*=\s*"\K[^"]+' || echo "")
          echo "version=$PREV" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          CUR="${{ steps.current.outputs.version }}"
          PREV="${{ steps.previous.outputs.version }}"
          TAG="v$CUR"

          if [ -z "$CUR" ] || [ "$CUR" = "$PREV" ]; then
            echo "Version unchanged ($CUR), skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version changed $PREV -> $CUR, releasing."
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - label: linux-aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - label: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - label: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          - label: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
          - label: windows-aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          BIN="target/${{ matrix.target }}/release/ezpm${{ contains(matrix.label, 'windows') && '.exe' || '' }}"
          ZIP_NAME="ezpm-${VERSION}-${{ matrix.label }}.zip"

          if [[ "${{ matrix.runner }}" == windows-* ]]; then
            7z a "$ZIP_NAME" "$BIN"
          else
            zip -j "$ZIP_NAME" "$BIN"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ezpm-${{ matrix.label }}
          path: "*.zip"

  release:
    name: Publish Release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --target main
