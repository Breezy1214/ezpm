name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-13
            os: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Unix)
        if: matrix.os != 'windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows x86_64)
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Build (Windows aarch64)
        if: matrix.os == 'windows' && matrix.arch == 'aarch64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows'
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ZIP_NAME="ezpm-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          cp target/${{ matrix.target }}/release/ezpm ./ezpm
          zip "${ZIP_NAME}" ezpm
          rm ezpm

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $ZIP_NAME = "ezpm-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/ezpm.exe" -Destination "ezpm.exe"
          Compress-Archive -Path "ezpm.exe" -DestinationPath $ZIP_NAME
          Remove-Item "ezpm.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezpm-${{ matrix.os }}-${{ matrix.arch }}
          path: "*.zip"

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
