[package]
name = "ezpm"
version = "0.2.0"
edition = "2021"
description = "Roblox project manager"
license = "MIT"

[[bin]]
name = "ezpm"
path = "rust-src/main.rs"

[lib]
name = "ezpm"
path = "rust-src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_ignored = "0.1"
inquire = "0.7"
thiserror = "1"
anyhow = "1"
walkdir = "2"
regex = "1"
ureq = "3"
owo-colors = { version = "4", features = ["supports-colors"] }
indicatif = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
nix = { version = "0.31", features = ["signal"] }
notify-debouncer-full = "0.7"

[dev-dependencies]
tempfile = "3"
